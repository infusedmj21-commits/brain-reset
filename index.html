<!doctype html>
<html lang="en-GB">

    <title>Artemis</title>
    <meta name="description" content="Michael’s life dashboard: ventures, shifts, money, health and the Brain Reset routine." />
    <meta name="theme-color" content="#B28570" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <script>
      // One glass look; the sidebar remembers whether it was left open (desktop only).
      document.documentElement.dataset.theme = 'glass';
      try {
        if (localStorage.getItem('artemis-sidebar') === 'open') document.documentElement.dataset.sidebar = 'open';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="room" aria-hidden="true"></div>

        <div class="side-h">Main</div>
        <a href="#/home" data-tab="home"><span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="lbl">Home</span></a>

        <nav class="subnav" id="subnav" aria-label="Section" hidden></nav>
        <main id="view" class="view" tabindex="-1"></main>

    </div>
    <script type="module" src="/src/main.js"></script>

</html>
