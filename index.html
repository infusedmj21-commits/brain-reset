<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Artemis</title>
    <meta name="description" content="Michael’s life dashboard: ventures, shifts, money, health and the Brain Reset routine." />
    <meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1726" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Artemis" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <script>
      // Set the theme before first paint so there's no flash of the wrong colours.
      try {
        var p = localStorage.getItem('brain-reset-theme');
        if (p !== 'light' && p !== 'dark') p = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = p;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div class="bg-shape" aria-hidden="true"></div>
    <nav class="tabbar" aria-label="Sections">
      <div class="brand"><i aria-hidden="true"></i>Artemis</div>
      <a href="#/home" data-tab="home"><span class="ti" aria-hidden="true">🏠</span>Home</a>
      <a href="#/ventures" data-tab="ventures"><span class="ti" aria-hidden="true">📊</span>Ventures</a>
      <a href="#/money" data-tab="money"><span class="ti" aria-hidden="true">💷</span>Money</a>
      <a href="#/health" data-tab="health"><span class="ti" aria-hidden="true">💪</span>Health</a>
      <a href="#/today" data-tab="today"><span class="ti" aria-hidden="true">🧠</span>Reset</a>
      <div class="tip"><b>Never miss twice</b>Missed a day? Do the minimum today and the streak lives on.</div>
    </nav>
    <nav class="subnav" id="subnav" aria-label="Brain Reset" hidden>
      <a href="#/today" data-sub="today">Today</a>
      <a href="#/palace" data-sub="palace">Palace</a>
      <a href="#/unprompted" data-sub="unprompted">Unprompted</a>
      <a href="#/progress" data-sub="progress">Progress</a>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
