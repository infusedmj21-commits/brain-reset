<!doctype html>

    <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15131c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <script>
      // Set the theme before first paint so there's no flash of the wrong colours.
      try {
        var p = localStorage.getItem('brain-reset-theme');
        if (p !== 'light' && p !== 'dark') p = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = p;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>

    <div class="bg-shape" aria-hidden="true"></div>
